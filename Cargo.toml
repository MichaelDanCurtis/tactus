[workspace]
members = ["crates/tactus-core", "crates/tactus-display", "crates/tactus-hid", "crates/tactus-io",
    "crates/tactus-odr", "crates/tactus-midi", "crates/tactus-ffi", "crates/tactus-nks",
    "crates/tactus-plugin-host", "crates/tactus-shim"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/REPLACE_ME/tactus"

[workspace.dependencies]
thiserror = "2.0"
