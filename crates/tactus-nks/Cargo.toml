[package]
name = "tactus-nks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reader for NKS preset files: metadata, plugin id and knob pages"

[dependencies]
rmpv = "1.3"
rusqlite = { version = "0.32", optional = true }
thiserror = "2"

[features]
# Read NI's per-product resource databases (the arc colour). Links the
# system SQLite.
resources = ["dep:rusqlite"]
